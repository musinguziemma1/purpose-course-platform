name: Monitor production
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: monitor-production
  cancel-in-progress: true
jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check database, public calendar and sign-in availability
        run: node scripts/monitor-production.mjs
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN || 'https://purpose-course-platform.vercel.app' }}
